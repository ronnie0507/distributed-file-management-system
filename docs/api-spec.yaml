openapi: 3.1.0
info:
  title: Distributed File Metadata API
  version: 0.4.0
paths:
  /api/health:
    get:
      summary: Foundation health check
      responses:
        "200":
          description: Service is running
  /api/auth/register:
    post:
      summary: Register a viewer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 100}
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128}
      responses:
        "201": {description: Account created}
        "409": {description: Username or email already exists}
  /api/auth/login:
    post:
      summary: Exchange account credentials for a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "200": {description: Signed access token}
        "401": {description: Invalid credentials}
  /api/auth/me:
    get:
      summary: Retrieve the authenticated account
      security:
        - bearerAuth: []
      responses:
        "200": {description: Current account}
        "401": {description: Missing or invalid token}
  /api/files/upload:
    post:
      summary: Upload a file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201": {description: Primary replica verified and replication job persisted}
        "400": {description: Invalid request}
        "401": {description: Missing or invalid token}
        "413": {description: File too large}
        "503": {description: Metadata, storage, or placement unavailable}
  /api/files:
    get:
      summary: List files owned by the authenticated account
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200": {description: File list}
  /api/files/{file_id}:
    get:
      summary: Retrieve file metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200": {description: File metadata}
        "404": {description: File not found}
    delete:
      summary: Delete a file
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204": {description: File deleted}
        "404": {description: File not found}
  /api/files/{file_id}/download:
    get:
      summary: Download file content
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Checksum-verified stream from a healthy replica
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404": {description: File not found or access denied}
        "503": {description: No verified healthy replica is readable}
  /api/files/{file_id}/versions:
    get:
      summary: List immutable versions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200": {description: Version list}
  /api/files/{file_id}/restore:
    post:
      summary: Restore a historical version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_number]
              properties:
                version_number:
                  type: integer
                  minimum: 1
      responses:
        "501": {description: Restore is not implemented yet}
  /api/nodes/health:
    get:
      summary: Report metadata and storage node health
      responses:
        "200": {description: Node health snapshot}
  /api/nodes:
    post:
      summary: Register a storage node
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_name, node_address]
              properties:
                node_name: {type: string, maxLength: 100}
                node_address: {type: string}
                capacity_bytes: {type: integer, minimum: 0}
      responses:
        "201": {description: Storage node registered}
        "403": {description: Administrator role required}
  /api/nodes/{node_id}/heartbeat:
    post:
      summary: Record node health
      security:
        - bearerAuth: []
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [healthy, degraded, unhealthy, offline, unknown]
                latency_ms: {type: integer, minimum: 0}
                used_bytes: {type: integer, minimum: 0}
      responses:
        "202": {description: Health record accepted}
        "403": {description: Administrator role required}
  /api/nodes/replication-jobs/{job_id}/retry:
    post:
      summary: Retry a dead replication job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202": {description: Replication job queued}
        "403": {description: Administrator role required}
        "409": {description: Job does not exist or is not retryable}
components:
  parameters:
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
