services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-file_metadata}
      POSTGRES_USER: ${POSTGRES_USER:-fileadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileadmin} -d ${POSTGRES_DB:-file_metadata}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dfms-worker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - worker-internal

  etcd-1:
    image: quay.io/coreos/etcd:v3.5.21
    environment:
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?Set ETCD_ROOT_PASSWORD in .env}
    command:
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=dfms-local-etcd
    volumes:
      - etcd_1_data:/etcd-data
    healthcheck:
      test:
        - CMD-SHELL
        - ETCDCTL_API=3 etcdctl --endpoints=http://127.0.0.1:2379 --user="root:$${ETCD_ROOT_PASSWORD}" endpoint health
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - worker-internal

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.21
    environment:
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?Set ETCD_ROOT_PASSWORD in .env}
    command:
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=dfms-local-etcd
    volumes:
      - etcd_2_data:/etcd-data
    healthcheck:
      test:
        - CMD-SHELL
        - ETCDCTL_API=3 etcdctl --endpoints=http://127.0.0.1:2379 --user="root:$${ETCD_ROOT_PASSWORD}" endpoint health
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - worker-internal

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.21
    environment:
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?Set ETCD_ROOT_PASSWORD in .env}
    command:
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=dfms-local-etcd
    volumes:
      - etcd_3_data:/etcd-data
    healthcheck:
      test:
        - CMD-SHELL
        - ETCDCTL_API=3 etcdctl --endpoints=http://127.0.0.1:2379 --user="root:$${ETCD_ROOT_PASSWORD}" endpoint health
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - worker-internal

  etcd-auth-bootstrap:
    build:
      context: ./infrastructure/etcd
    environment:
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?Set ETCD_ROOT_PASSWORD in .env}
      ETCD_USERNAME: ${ETCD_USERNAME:-dfms-worker}
      ETCD_PASSWORD: ${ETCD_PASSWORD:?Set ETCD_PASSWORD in .env}
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    networks:
      - worker-internal

  minio-node-1:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_NODE_1_ACCESS_KEY:-${MINIO_ROOT_USER:?Set storage node 1 credentials in .env}}
      MINIO_ROOT_PASSWORD: ${STORAGE_NODE_1_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set storage node 1 credentials in .env}}
    volumes:
      - minio_data:/data

  minio-node-2:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_NODE_2_ACCESS_KEY:?Set STORAGE_NODE_2_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_NODE_2_SECRET_KEY:?Set STORAGE_NODE_2_SECRET_KEY in .env}
    volumes:
      - minio_node_2_data:/data

  minio-node-3:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_NODE_3_ACCESS_KEY:?Set STORAGE_NODE_3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_NODE_3_SECRET_KEY:?Set STORAGE_NODE_3_SECRET_KEY in .env}
    volumes:
      - minio_node_3_data:/data

  minio-node-4:
    image: minio/minio:latest
    profiles: ["spare"]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_NODE_4_ACCESS_KEY:?Set STORAGE_NODE_4_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_NODE_4_SECRET_KEY:?Set STORAGE_NODE_4_SECRET_KEY in .env}
    volumes:
      - minio_node_4_data:/data

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fileadmin:change-me@postgres:5432/file_metadata}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fileadmin:change-me@postgres:5432/file_metadata}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_BUCKET: ${MINIO_BUCKET:-distributed-files}
      MINIO_ENDPOINT: minio-node-1:9000
      MINIO_ACCESS_KEY: ${STORAGE_NODE_1_ACCESS_KEY:-${MINIO_ROOT_USER:?Set storage node 1 credentials in .env}}
      MINIO_SECRET_KEY: ${STORAGE_NODE_1_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set storage node 1 credentials in .env}}
      STORAGE_NODE_COUNT: ${STORAGE_NODE_COUNT:-3}
      STORAGE_REPLICATION_FACTOR: ${STORAGE_REPLICATION_FACTOR:-3}
      STORAGE_NODE_1_NAME: ${STORAGE_NODE_1_NAME:-node-1}
      STORAGE_NODE_1_ENDPOINT: minio-node-1:9000
      STORAGE_NODE_1_ACCESS_KEY: ${STORAGE_NODE_1_ACCESS_KEY:-${MINIO_ROOT_USER:?Set storage node 1 credentials in .env}}
      STORAGE_NODE_1_SECRET_KEY: ${STORAGE_NODE_1_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set storage node 1 credentials in .env}}
      STORAGE_NODE_1_CAPACITY_BYTES: ${STORAGE_NODE_1_CAPACITY_BYTES:-10737418240}
      STORAGE_NODE_2_NAME: ${STORAGE_NODE_2_NAME:-node-2}
      STORAGE_NODE_2_ENDPOINT: minio-node-2:9000
      STORAGE_NODE_2_ACCESS_KEY: ${STORAGE_NODE_2_ACCESS_KEY:?Set STORAGE_NODE_2_ACCESS_KEY in .env}
      STORAGE_NODE_2_SECRET_KEY: ${STORAGE_NODE_2_SECRET_KEY:?Set STORAGE_NODE_2_SECRET_KEY in .env}
      STORAGE_NODE_2_CAPACITY_BYTES: ${STORAGE_NODE_2_CAPACITY_BYTES:-10737418240}
      STORAGE_NODE_3_NAME: ${STORAGE_NODE_3_NAME:-node-3}
      STORAGE_NODE_3_ENDPOINT: minio-node-3:9000
      STORAGE_NODE_3_ACCESS_KEY: ${STORAGE_NODE_3_ACCESS_KEY:?Set STORAGE_NODE_3_ACCESS_KEY in .env}
      STORAGE_NODE_3_SECRET_KEY: ${STORAGE_NODE_3_SECRET_KEY:?Set STORAGE_NODE_3_SECRET_KEY in .env}
      STORAGE_NODE_3_CAPACITY_BYTES: ${STORAGE_NODE_3_CAPACITY_BYTES:-10737418240}
      STORAGE_NODE_4_NAME: ${STORAGE_NODE_4_NAME:-node-4}
      STORAGE_NODE_4_ENDPOINT: minio-node-4:9000
      STORAGE_NODE_4_ACCESS_KEY: ${STORAGE_NODE_4_ACCESS_KEY:?Set STORAGE_NODE_4_ACCESS_KEY in .env}
      STORAGE_NODE_4_SECRET_KEY: ${STORAGE_NODE_4_SECRET_KEY:?Set STORAGE_NODE_4_SECRET_KEY in .env}
      STORAGE_NODE_4_CAPACITY_BYTES: ${STORAGE_NODE_4_CAPACITY_BYTES:-10737418240}
      STORAGE_HEARTBEAT_TTL_SECONDS: ${STORAGE_HEARTBEAT_TTL_SECONDS:-60}
      REPLICATION_JOB_LEASE_SECONDS: ${REPLICATION_JOB_LEASE_SECONDS:-300}
      REPLICATION_MAX_ATTEMPTS: ${REPLICATION_MAX_ATTEMPTS:-5}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-node-1:
        condition: service_started
      minio-node-2:
        condition: service_started
      minio-node-3:
        condition: service_started

  replication-worker:
    build:
      context: ./backend
    command: ["python", "-m", "workers.replication_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fileadmin:change-me@postgres:5432/file_metadata}
      MINIO_BUCKET: ${MINIO_BUCKET:-distributed-files}
      STORAGE_NODE_COUNT: ${STORAGE_NODE_COUNT:-3}
      STORAGE_REPLICATION_FACTOR: ${STORAGE_REPLICATION_FACTOR:-3}
      STORAGE_NODE_1_NAME: ${STORAGE_NODE_1_NAME:-node-1}
      STORAGE_NODE_1_ENDPOINT: minio-node-1:9000
      STORAGE_NODE_1_ACCESS_KEY: ${STORAGE_NODE_1_ACCESS_KEY:-${MINIO_ROOT_USER:?Set storage node 1 credentials in .env}}
      STORAGE_NODE_1_SECRET_KEY: ${STORAGE_NODE_1_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set storage node 1 credentials in .env}}
      STORAGE_NODE_1_CAPACITY_BYTES: ${STORAGE_NODE_1_CAPACITY_BYTES:-10737418240}
      STORAGE_NODE_2_NAME: ${STORAGE_NODE_2_NAME:-node-2}
      STORAGE_NODE_2_ENDPOINT: minio-node-2:9000
      STORAGE_NODE_2_ACCESS_KEY: ${STORAGE_NODE_2_ACCESS_KEY:?Set STORAGE_NODE_2_ACCESS_KEY in .env}
      STORAGE_NODE_2_SECRET_KEY: ${STORAGE_NODE_2_SECRET_KEY:?Set STORAGE_NODE_2_SECRET_KEY in .env}
      STORAGE_NODE_2_CAPACITY_BYTES: ${STORAGE_NODE_2_CAPACITY_BYTES:-10737418240}
      STORAGE_NODE_3_NAME: ${STORAGE_NODE_3_NAME:-node-3}
      STORAGE_NODE_3_ENDPOINT: minio-node-3:9000
      STORAGE_NODE_3_ACCESS_KEY: ${STORAGE_NODE_3_ACCESS_KEY:?Set STORAGE_NODE_3_ACCESS_KEY in .env}
      STORAGE_NODE_3_SECRET_KEY: ${STORAGE_NODE_3_SECRET_KEY:?Set STORAGE_NODE_3_SECRET_KEY in .env}
      STORAGE_NODE_3_CAPACITY_BYTES: ${STORAGE_NODE_3_CAPACITY_BYTES:-10737418240}
      STORAGE_NODE_4_NAME: ${STORAGE_NODE_4_NAME:-node-4}
      STORAGE_NODE_4_ENDPOINT: minio-node-4:9000
      STORAGE_NODE_4_ACCESS_KEY: ${STORAGE_NODE_4_ACCESS_KEY:?Set STORAGE_NODE_4_ACCESS_KEY in .env}
      STORAGE_NODE_4_SECRET_KEY: ${STORAGE_NODE_4_SECRET_KEY:?Set STORAGE_NODE_4_SECRET_KEY in .env}
      STORAGE_NODE_4_CAPACITY_BYTES: ${STORAGE_NODE_4_CAPACITY_BYTES:-10737418240}
      STORAGE_HEALTH_INTERVAL_SECONDS: ${STORAGE_HEALTH_INTERVAL_SECONDS:-10}
      REPLICATION_POLL_SECONDS: ${REPLICATION_POLL_SECONDS:-2}
      STORAGE_HEARTBEAT_TTL_SECONDS: ${STORAGE_HEARTBEAT_TTL_SECONDS:-60}
      REPLICATION_JOB_LEASE_SECONDS: ${REPLICATION_JOB_LEASE_SECONDS:-300}
      REPLICATION_MAX_ATTEMPTS: ${REPLICATION_MAX_ATTEMPTS:-5}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-dfms-worker}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_CONNECTION_TIMEOUT_SECONDS: ${RABBITMQ_CONNECTION_TIMEOUT_SECONDS:-5}
      ETCD_ENDPOINTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      ETCD_USERNAME: ${ETCD_USERNAME:-dfms-worker}
      ETCD_PASSWORD: ${ETCD_PASSWORD:?Set ETCD_PASSWORD in .env}
      ETCD_TIMEOUT_SECONDS: ${ETCD_TIMEOUT_SECONDS:-5}
      ETCD_MEMBERSHIP_TTL_SECONDS: ${ETCD_MEMBERSHIP_TTL_SECONDS:-30}
      ETCD_LEADER_TTL_SECONDS: ${ETCD_LEADER_TTL_SECONDS:-30}
      COORDINATION_POLL_SECONDS: ${COORDINATION_POLL_SECONDS:-5}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-30}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      etcd-auth-bootstrap:
        condition: service_completed_successfully
      minio-node-1:
        condition: service_started
      minio-node-2:
        condition: service_started
      minio-node-3:
        condition: service_started
    networks:
      - default
      - worker-internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  minio_node_2_data:
  minio_node_3_data:
  minio_node_4_data:
  rabbitmq_data:
  etcd_1_data:
  etcd_2_data:
  etcd_3_data:

networks:
  worker-internal:
    internal: true
